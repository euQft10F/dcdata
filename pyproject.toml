[project]
name = "dcdata"
version = "0.1.0"
description = "Scrape CDS Determinations Committee credit events and creditfixings.com auction results, and match them deterministically"
readme = "README.md"
authors = [
    { name = "Bronze Halibut", email = "pybronzehalibut.i9v9y@slmails.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pymupdf4llm>=2.1",
    "tenacity>=9.2.1",
]

[project.scripts]
dcdata = "dcdata.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # formatter handles wrapping; long strings are ok

[tool.pytest.ini_options]
testpaths = ["tests"]
